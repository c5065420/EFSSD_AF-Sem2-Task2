{% extends "base.html" %}

{% block content %}
<div class="kc-section">
  <div class="container" style="max-width:600px;">

    <div class="section-label">Support</div>
    <div class="section-title">Contact Us</div>
    <p style="color:var(--fog);margin-bottom:2rem;">Have a question or feedback? We'd love to hear from you.</p>

    <div class="form-card">
      <form action="{{ url_for('contact') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" name="name" placeholder="Your name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" name="message" rows="4"
                    placeholder="How can we help?" required style="resize:vertical;"></textarea>
        </div>

        <div class="d-flex align-items-center gap-3">
          <button type="submit" class="btn-kc btn-kc-lg"><i class="bi bi-send-fill"></i> Send Message</button>
          <span style="font-size:0.78rem;color:var(--fog);">We usually reply within 24 hours.</span>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
