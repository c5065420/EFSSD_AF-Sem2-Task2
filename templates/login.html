{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo"><span style="color:var(--pitch)">⚽</span> Kick-Off Connect</div>
    <div class="auth-sub">Fan transport, sorted together.</div>

    <div class="auth-tab-bar">
      <a href="{{ url_for('login') }}"    class="auth-tab active">Login</a>
      <a href="{{ url_for('register') }}" class="auth-tab">Register</a>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" type="text" class="form-control" placeholder="your username"
               value="{{ request.form.get('username', '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-kc btn-kc-block btn-kc-lg mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>
    </form>

    <p class="auth-hint">
      Demo — Fan: <code>jamie</code> / <code>FanPass2025!</code><br>
      Admin: <code style="color:var(--amber);">admin</code> / <code style="color:var(--amber);">AdminPass2025!</code>
    </p>

  </div>
</div>
{% endblock %}
