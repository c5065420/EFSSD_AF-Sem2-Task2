{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo"><span style="color:var(--pitch)">⚽</span> KickOff Connect</div>
    <div class="auth-sub">Join the community. Organise or book trips.</div>

    <div class="auth-tab-bar">
      <a href="{{ url_for('login') }}"    class="auth-tab">Login</a>
      <a href="{{ url_for('register') }}" class="auth-tab active">Register</a>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" type="text" class="form-control" placeholder="choose a username"
               value="{{ request.form.get('username', '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="choose a strong password">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input name="repassword" type="password" class="form-control" placeholder="repeat your password">
      </div>

      <button type="submit" class="btn-kc btn-kc-block btn-kc-lg mt-1">
        <i class="bi bi-person-plus"></i> Create Account
      </button>
    </form>

  </div>
</div>
{% endblock %}
