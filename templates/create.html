{% extends "base.html" %}

{% block content %}

    <h1>Post a Trip</h1>
    <hr>

    <!-- Add Trip Form -->
    <form method="post" enctype="multipart/form-data" class="row g-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="col-12">
            <div class="form-floating">
                <input name="match_title" type="text" class="form-control" id="match_title" placeholder="e.g. Sheffield Utd vs Arsenal">
                <label for="match_title">Match (e.g. Home vs Away)</label>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="form-floating">
                <select name="competition" class="form-select" id="competition">
                    <option value="">Select Competition</option>
                    <option value="Premier League">Premier League</option>
                    <option value="Championship">Championship</option>
                    <option value="League One">League One</option>
                    <option value="League Two">League Two</option>
                    <option value="FA Cup">FA Cup</option>
                    <option value="EFL Cup">EFL Cup</option>
                    <option value="Champions League">Champions League</option>
                    <option value="Other">Other</option>
                </select>
                <label for="competition">Competition</label>
            </div>
        </div>
        <div class="col-lg-3">
            <div class="form-floating">
                <input name="match_date" type="date" class="form-control" id="match_date">
                <label for="match_date">Match Date</label>
            </div>
        </div>
        <div class="col-lg-3">
            <div class="form-floating">
                <input name="kickoff_time" type="time" class="form-control" id="kickoff_time" value="15:00">
                <label for="kickoff_time">Kick-off Time</label>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="form-floating">
                <input name="departure_point" type="text" class="form-control" id="departure_point" placeholder="e.g. Pond Street Bus Station">
                <label for="departure_point">Departure Point</label>
            </div>
        </div>
        <div class="col-lg-3">
            <div class="form-floating">
                <input name="departure_time" type="time" class="form-control" id="departure_time" value="12:30">
                <label for="departure_time">Departure Time</label>
            </div>
        </div>

        <div class="col-12">
            <div class="form-floating">
                <input name="destination" type="text" class="form-control" id="destination" placeholder="e.g. Bramall Lane, Sheffield">
                <label for="destination">Destination (Stadium)</label>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="form-floating">
                <input name="total_seats" type="number" class="form-control" id="total_seats" placeholder="40" min="1" max="100">
                <label for="total_seats">Total Seats Available</label>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="form-floating">
                <input name="price" type="number" step="0.01" class="form-control" id="price" placeholder="12.00" min="0">
                <label for="price">Price Per Seat (£)</label>
            </div>
        </div>

        <div class="col-12">
            <label for="poster" class="form-label">Poster/Image (optional)</label>
            <input name="poster" type="file" accept="image/*" class="form-control" id="poster">
        </div>

        <div class="col-12">
            <div class="form-floating">
                <textarea name="notes" class="form-control" placeholder="Notes" id="notes" style="height: 100px"></textarea>
                <label for="notes">Notes for Passengers (meeting instructions, payment, return time)</label>
            </div>
        </div>

        <div class="col-12 text-center">
            <button type="submit" class="btn btn-success w-100">Post Trip</button>
        </div>

    </form>

{% endblock %}
