{% extends "base.html" %}

{% block content %}
<div class="kc-section">
  <div class="container" style="max-width:740px;">

    <div class="section-label">Organiser</div>
    <div class="section-title">Post a Trip</div>
    <p style="color:var(--fog);margin-bottom:2rem;">Fill in the details below to list your transport for other fans to book.</p>

    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-card mb-3">
        <h6>Match Information</h6>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Match Title</label>
            <input name="match_title" type="text" class="form-control" placeholder="e.g. Sheffield Utd vs Arsenal">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Competition</label>
            <select name="competition" class="form-select">
              <option value="">Select Competition</option>
              <option>Premier League</option>
              <option>Championship</option>
              <option>League One</option>
              <option>League Two</option>
              <option>FA Cup</option>
              <option>EFL Cup</option>
              <option>EFL Trophy</option>
              <option>Champions League</option>
              <option>Europa League</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label">Match Date</label>
            <input name="match_date" type="date" class="form-control">
          </div>
          <div class="col-sm-3">
            <label class="form-label">Kick-off Time</label>
            <input name="kick-off_time" type="time" class="form-control" value="15:00">
          </div>
        </div>
      </div>

      <div class="form-card mb-3">
        <h6>Transport Details</h6>
        <div class="row g-3">
          <div class="col-sm-8">
            <label class="form-label">Departure Point</label>
            <input name="departure_point" type="text" class="form-control" placeholder="e.g. Pond Street Bus Station, Bay 7">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Departure Time</label>
            <input name="departure_time" type="time" class="form-control" value="12:30">
          </div>
          <div class="col-12">
            <label class="form-label">Destination (Stadium)</label>
            <input name="destination" type="text" class="form-control" placeholder="e.g. Bramall Lane, Sheffield">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Total Seats</label>
            <input name="total_seats" type="number" class="form-control" placeholder="40" min="1" max="100">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Price Per Seat (£)</label>
            <input name="price" type="number" step="0.01" class="form-control" placeholder="12.00" min="0">
          </div>
          <div class="col-12">
            <label class="form-label">Notes for Passengers</label>
            <textarea name="notes" class="form-control" rows="3"
              placeholder="Meeting instructions, return time, payment method, contact details…"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Poster / Image (optional)</label>
            <input name="poster" type="file" accept="image/*">
          </div>
        </div>
      </div>

      <div class="d-flex gap-3">
        <button type="submit" class="btn-kc btn-kc-lg"><i class="bi bi-send-fill"></i> Publish Trip</button>
        <a href="{{ url_for('trips') }}" class="btn-kc-outline btn-kc-lg">Cancel</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
