name: Auto PR — Staging to Prod

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Open PR from staging → prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --base prod \
            --head staging \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR (staging → prod)
        if: steps.check_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base prod \
            --head staging \
            --title "🚀 Merge staging → prod ($(date +'%Y-%m-%d %H:%M UTC'))" \
            --body "## Automated PR

          This PR was automatically created when \`staging\` received a new push.

          ### Checklist before merging
          - [ ] Changes reviewed
          - [ ] Tests passing
          - [ ] Ready for production

          > ⚠️ This PR requires approval from a **CODEOWNER** before it can be merged." \
            --assignee "${{ github.actor }}"

      - name: Log result
        run: |
          echo "✅ Done. PR opened or already exists."
